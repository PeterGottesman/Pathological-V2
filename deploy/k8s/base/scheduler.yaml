apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  labels:
    app: scheduler
spec:
  # In-memory job/worker state, so replicas beyond 1 would each see a
  # different world -- one scheduler is a hard requirement, not a default.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: pathological-scheduler:latest
          args: ["--http-port", "8080", "--grpc-port", "50052"]
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50052
          envFrom:
            - configMapRef:
                name: pathological-config
            - secretRef:
                name: pathological-s3-credentials
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  labels:
    app: scheduler
spec:
  selector:
    app: scheduler
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 50052
      targetPort: grpc
