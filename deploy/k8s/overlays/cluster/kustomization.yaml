apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Not applied automatically -- create the real S3 credentials Secret
# yourself first (see secret.example.yaml and deploy/README.md), since a
# working one can't be committed to git.

# Point at wherever the cluster's nodes can actually pull images from --
# base's `pathological-*:latest` names are placeholders for local kind
# loading only.
# images:
#   - name: pathological-scheduler
#     newName: <your-registry>/pathological-scheduler
#     newTag: <tag>
#   - name: pathological-render-worker
#     newName: <your-registry>/pathological-render-worker
#     newTag: <tag>
#   - name: pathological-frontend
#     newName: <your-registry>/pathological-frontend
#     newTag: <tag>

patches:
  - path: render-worker-patch.yaml
