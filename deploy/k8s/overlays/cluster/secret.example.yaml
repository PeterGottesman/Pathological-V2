# Template only -- not a kustomize resource (nothing references this file),
# so it's never applied with these placeholder values. Create the real thing
# out-of-band instead, e.g.:
#
#   kubectl create secret generic pathological-s3-credentials \
#     -n pathological \
#     --from-literal=AWS_ACCESS_KEY_ID=... \
#     --from-literal=AWS_SECRET_ACCESS_KEY=...
#
# or via whatever secrets-management your cluster already uses (External
# Secrets, sealed-secrets, ...). Both the scheduler and render_worker
# Deployments expect a Secret with exactly this name in this namespace.
apiVersion: v1
kind: Secret
metadata:
  name: pathological-s3-credentials
  namespace: pathological
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: REPLACE_ME
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
