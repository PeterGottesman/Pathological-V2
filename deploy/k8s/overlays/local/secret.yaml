# Local-testing-only credentials for the in-cluster MinIO stand-in for S3.
# Not used against real AWS -- the cluster overlay supplies its own Secret
# with real credentials instead of this file.
apiVersion: v1
kind: Secret
metadata:
  name: pathological-s3-credentials
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
