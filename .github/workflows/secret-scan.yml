name: Secret scan

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only required for gitleaks-action on repos owned by a GitHub org; unset is fine
          # for personal accounts and public repos. Add a GITLEAKS_LICENSE repo secret if
          # this job starts failing with a license error.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
