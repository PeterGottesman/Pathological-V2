name: JS lint

"on":
  push:
    branches: [main]
    paths: &js-paths
      - "frontend/**"
      - ".github/workflows/js-lint.yml"
  pull_request:
    paths: *js-paths
  workflow_dispatch:

concurrency:
  group: js-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit
