name: C++ static analysis

"on":
  push:
    branches: [main]
    paths: &cpp-paths
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".clang-tidy"
      - "common/**"
      - "scheduler/**"
      - "render_worker/**"
      - "protos/**"
      - ".github/workflows/cpp-tidy.yml"
  pull_request:
    paths: *cpp-paths
  workflow_dispatch:

concurrency:
  group: cpp-tidy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: clang-tidy (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    # clang-tidy has never been run against this codebase before, so the first few runs are
    # expected to surface a backlog of pre-existing findings. Non-blocking until that backlog
    # is triaged; flip this to `false` once the check is quiet enough to gate merges on.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: scheduler
            binary_dir: build-scheduler
            src_dirs: scheduler/src common
            needs_vulkan: false
          - preset: render-worker
            binary_dir: build-render-worker
            src_dirs: render_worker/src common
            needs_vulkan: true
    steps:
      - uses: actions/checkout@v4

      # Shares a cache key/scope with cpp-build.yml's identical step, so a clang-tidy run can
      # reuse archives a build job already produced (and vice versa).
      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-archives-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-${{ matrix.preset }}-

      - name: Install CMake + Ninja
        uses: lukka/get-cmake@latest

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy-18

      - name: Install Vulkan SDK
        if: matrix.needs_vulkan
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | gpg --dearmor | sudo tee /usr/share/keyrings/lunarg-archive-keyring.gpg > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo sed -i -E 's#^deb(-src)? #deb\1 [signed-by=/usr/share/keyrings/lunarg-archive-keyring.gpg] #' /etc/apt/sources.list.d/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: e7b524242c8a5d718a7afa26794c3c19bb8b0c71

      - name: Configure (installs deps + generates compile_commands.json)
        run: cmake --preset ${{ matrix.preset }}

      - name: Run clang-tidy
        run: |
          files=$(find ${{ matrix.src_dirs }} -type f \( -name "*.cpp" -o -name "*.cc" \))
          clang-tidy-18 -p ${{ matrix.binary_dir }} $files
