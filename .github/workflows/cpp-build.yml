name: C++ build

"on":
  push:
    branches: [main]
    paths: &cpp-paths
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "common/**"
      - "scheduler/**"
      - "render_worker/**"
      - "protos/**"
      - ".github/workflows/cpp-build.yml"
  pull_request:
    paths: *cpp-paths
  workflow_dispatch:

concurrency:
  group: cpp-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # lukka/run-vcpkg auto-sets VCPKG_BINARY_SOURCES to the (now-removed) x-gha backend whenever
  # this isn't already set, so it has to be set explicitly here. "default" is vcpkg's own local
  # file cache (~/.cache/vcpkg/archives on Linux) — the same path the "Cache vcpkg binary
  # archives" step below persists across runs.
  VCPKG_BINARY_SOURCES: "clear;default,readwrite"

jobs:
  build:
    name: build (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: scheduler
            binary_dir: build-scheduler
            needs_vulkan: false
          - preset: render-worker
            binary_dir: build-render-worker
            needs_vulkan: true
    steps:
      - uses: actions/checkout@v4

      # vcpkg's own "x-gha" cache backend was removed by vcpkg-tool; wrap its default local
      # archive cache (~/.cache/vcpkg/archives) with actions/cache instead.
      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-archives-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-${{ matrix.preset }}-

      - name: Install CMake + Ninja
        uses: lukka/get-cmake@latest

      - name: Install Vulkan SDK
        if: matrix.needs_vulkan
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | gpg --dearmor | sudo tee /usr/share/keyrings/lunarg-archive-keyring.gpg > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo sed -i -E 's#^deb(-src)? #deb\1 [signed-by=/usr/share/keyrings/lunarg-archive-keyring.gpg] #' /etc/apt/sources.list.d/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: e7b524242c8a5d718a7afa26794c3c19bb8b0c71

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build ${{ matrix.binary_dir }} --parallel
