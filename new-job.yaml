apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: pathological
spec:
  backoffLimit: 6
  template:
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - |
          set -e
          until mc alias set local "$S3_ENDPOINT" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
            echo "waiting for minio..."
            sleep 3
          done
          mc mb --ignore-existing "local/$S3_BUCKET"
          mc anonymous set download "local/$S3_BUCKET"
        envFrom:
        - configMapRef:
            name: pathological-config
        - secretRef:
            name: pathological-s3-credentials
        image: cgr.dev/chainguard/minio-client:latest-dev
        imagePullPolicy: Always
        name: mc
      restartPolicy: OnFailure
